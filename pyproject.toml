[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "0.3.0"
description = "Decentralized asyncio P2P task execution mesh"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]